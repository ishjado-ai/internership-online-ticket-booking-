<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport - Smart Ticket</title>

<style>
:root {
    --primary: #007bff;
    --primary-dark: #0056b3;
    --bg: #f0f2f5;
    --text: #333;
    --muted: #666;
    --white: #fff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
}

/* HEADER */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 5%;
    background: var(--white);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-circle {
    background: var(--primary);
    color: white;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

.nav-links {
    font-size: 0.9rem;
}

/* BACK LINK */
.back-nav {
    padding: 15px 5%;
}

.back-nav a {
    text-decoration: none;
    color: var(--primary);
    font-weight: bold;
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 20px;
    color: var(--text);
}

/* GRID */
.grid-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    padding: 0 5% 40px;
}

/* CARD */
.bus-card {
    background: var(--white);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    transition: 0.3s ease;
}

.bus-card:hover {
    transform: translateY(-6px);
}

.bus-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

/* DETAILS */
.details {
    padding: 15px;
}

.details h3 {
    margin-bottom: 10px;
    color: var(--text);
    font-size: 1.1rem;
}

.details p {
    font-size: 0.9rem;
    color: var(--muted);
}

/* BUTTON */
.book-btn {
    margin-top: 12px;
    width: 100%;
    padding: 10px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 500;
    transition: 0.3s;
}

.book-btn:hover {
    background: var(--primary-dark);
}
</style>
</head>

<body>

<header>
    <div class="logo-area">
        <div class="logo-circle">ST</div>
        <div>
            <div style="font-weight:bold;">Smart Ticket</div>
            <div style="font-size:0.8rem;color:#777;">Online Booking System</div>
        </div>
    </div>
    <div class="nav-links">
        👤 User
    </div>
</header>

<nav class="back-nav">
    <a href="home.html">← Back to Dashboard</a>
</nav>

<h2>Available Transport</h2>

<div class="grid-container" id="transportList"></div>

<script>
const transportData = [
    {route:"Kigali - Kampala", time:"08:00 AM", price:30500, img:"stage pic/bus 1.jpg"},
    {route:"Kigali - Tanzania", time:"10:30 AM", price:40000, img:"stage pic/bus 2.jpg"},
    {route:"Kigali - Rubavu", time:"09:00 AM", price:5000, img:"stage pic/bus 3.jpg"},
    {route:"Kigali - Rusizi", time:"07:30 AM", price:6000, img:"stage pic/bus 4.jpg"},
    {route:"Kigali - Nyagatare", time:"11:00 AM", price:3000, img:"stage pic/bus 5.jpg"},
    {route:"Kigali - Muhanga", time:"01:00 PM", price:2500, img:"stage pic/bus 6.jpg"},
    {route:"Kigali - Gatsibo", time:"09:00 AM", price:3000, img:"stage pic/bus 8.jpg"},
    {route:"Kigali - Ruhengeri", time:"09:00 AM", price:5000, img:"stage pic/bus 9.jpg"},
    {route:"Kigali - Nyamagabe", time:"09:00 AM", price:7000, img:"stage pic/bus 10.jpg"},
    {route:"Kigali - Karongi", time:"09:00 AM", price:5000, img:"stage pic/bus 11.jpg"},
    {route:"Kigali - Rwamagana", time:"09:00 AM", price:2000, img:"stage pic/bus 13.jpg"}
];

// Render cards dynamically
const container = document.getElementById("transportList");

transportData.forEach(bus => {
    container.innerHTML += `
        <div class="bus-card">
            <img src="${bus.img}" class="bus-img" alt="Bus">
            <div class="details">
                <h3>${bus.route}</h3>
                <p><strong>Departure:</strong> ${bus.time}</p>
                <p><strong>Price:</strong> ${bus.price.toLocaleString()} RWF</p>
                <button class="book-btn" onclick="bookSeat('${bus.route}','${bus.time}','${bus.price}')">
                    Book Seat
                </button>
            </div>
        </div>
    `;
});

// Booking function
function bookSeat(route, departure, price) {
    const booking = {
        type: "transport",
        event: { route, time: departure, price },
        user: { name: "", phone: "" }
    };

    localStorage.setItem("booking", JSON.stringify(booking));
    window.location.href = "payment.html";
}
</script>

</body>
</html>
