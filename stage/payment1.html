
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Details - Smart Ticket</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#efefef;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.circle{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#2f6df6;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.small{
    font-size:11px;
    color:#666;
}

.user{
    text-align:center;
    font-size:12px;
}

.wrapper{
    width:95%;
    max-width:520px;
    margin:auto;
    background:#f5f5f5;
    border-radius:15px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

.head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ccc;
    padding-bottom:10px;
    margin-bottom:18px;
}

.back{
    color:blue;
    text-decoration:none;
    font-size:14px;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.summary{
    background:#e9e6e6;
    padding:18px;
    border-radius:12px;
    margin-bottom:18px;
}

.summary h3{
    margin-bottom:10px;
}

.summary p{
    margin:8px 0;
}

.total{
    color:#1856ff;
    font-weight:bold;
}

.pay-title{
    font-size:24px;
    margin-bottom:12px;
}

.methods{
    display:flex;
    gap:12px;
    margin-bottom:18px;
}

.method{
    flex:1;
    border:1px solid #bbb;
    border-radius:10px;
    background:#fff;
    padding:12px;
    text-align:center;
    cursor:pointer;
    font-weight:bold;
    font-size:20px;
    transition:0.3s;
}

.method:hover{
    background:#f0f7ff;
}

.method.active{
    border:2px solid #28a745;
    background:#eafaf0;
}

.mtn{color:#ffc400;}
.airtel{color:#e30000;}
.visa{color:#0a58ca;}

label{
    display:block;
    margin:10px 0 6px;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    margin-bottom:10px;
}

button{
    width:100%;
    margin-top:18px;
    background:#28a745;
    color:#fff;
    border:none;
    padding:14px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1f8b38;
}

.ticket-box{
    width:95%;
    max-width:520px;
    margin:20px auto;
    background:#fff;
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    display:none;
}

.ticket-box h2{
    text-align:center;
    color:#28a745;
    margin-bottom:15px;
}

.row{
    margin:8px 0;
    border-bottom:1px dashed #ddd;
    padding-bottom:8px;
}

.barcode{
    text-align:center;
    font-size:30px;
    letter-spacing:4px;
    margin-top:18px;
}

.download-btn{
    background:#007bff;
    margin-top:15px;
}

.download-btn:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="logo">
        <div class="circle">ST</div>
        <div>
            <strong>Smart Ticket</strong><br>
            <span class="small">online booking system</span>
        </div>
    </div>

    <div class="user">
        👤<br>USER
    </div>
</div>

<div class="wrapper">

    <div class="head">
        <a href="event-details.html" class="back">← Back</a>
        <div class="title">Payment Details</div>
        <div></div>
    </div>

    <div class="summary">
        <h3>Booking Summary</h3>
        <p><b>Route :</b> <span id="routeText"></span></p>
        <p><b>Time :</b> <span id="timeText"></span></p>
        <p class="total">TOTAL : <span id="priceText"></span></p>
    </div>

    <div class="pay-title">Select Payment Method</div>

    <div class="methods">
        <div class="method mtn active" onclick="chooseMethod(this,'MTN MoMo')">MTN</div>
        <div class="method airtel" onclick="chooseMethod(this,'Airtel Money')">Airtel</div>
        <div class="method visa" onclick="chooseMethod(this,'VISA')">VISA</div>
    </div>

    <label>Passenger Full Name</label>
    <input type="text" id="fullname" placeholder="Full Name">

    <label id="numLabel">MTN MoMo Number</label>
    <input type="text" id="phone" placeholder="078 xxx xxx">

    <button onclick="payNow()">Pay and Book Ticket</button>

</div>



<script>
let selectedMethod = "MTN MoMo";

function chooseMethod(el, method){
    document.querySelectorAll(".method").forEach(btn=>{
        btn.classList.remove("active");
    });

    el.classList.add("active");
    selectedMethod = method;

    const label = document.getElementById("numLabel");
    const input = document.getElementById("phone");

    if(method === "VISA"){
        label.innerText = "Visa Card Number";
        input.placeholder = "**** **** **** 1234";
    }else if(method === "Airtel Money"){
        label.innerText = "Airtel Number";
        input.placeholder = "073 xxx xxx";
    }else{
        label.innerText = "MTN MoMo Number";
        input.placeholder = "078 xxx xxx";
    }
}

function payNow(){
    let fullname = document.getElementById("fullname").value.trim();
    let phone = document.getElementById("phone").value.trim();

    if(fullname === "" || phone === ""){
        alert("Please fill all fields.");
        return;
    }

    let id = "ST" + Math.floor(Math.random()*999999999);
    let seat = "Seat " + Math.floor(Math.random()*40 + 1);

    let route = document.getElementById("routeText").innerText;
    let time = document.getElementById("timeText").innerText;
    let amount = document.getElementById("priceText").innerText;

    document.getElementById("tName").innerText = fullname;
    document.getElementById("tMethod").innerText = selectedMethod;
    document.getElementById("tNumber").innerText = phone;
    document.getElementById("ticketId").innerText = id;
    document.getElementById("tRoute").innerText = route;
    document.getElementById("tTime").innerText = time;
    document.getElementById("tAmount").innerText = amount;
    document.getElementById("tSeat").innerText = seat;

    localStorage.setItem("lastPassenger", fullname);
    localStorage.setItem("lastRoute", route);
    localStorage.setItem("lastDeparture", time);
    localStorage.setItem("lastPrice", amount);
    localStorage.setItem("lastPaymentMethod", selectedMethod);
    localStorage.setItem("lastPaymentNumber", phone);
    localStorage.setItem("bookingID", id);
    localStorage.setItem("seatNumber", seat);

    document.getElementById("ticketBox").style.display = "block";

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}
</script>

</body>
</html>
