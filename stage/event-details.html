<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Details</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.back-link{
    text-decoration:none;
    color:#333;
    font-weight:bold;
}

.event-banner{
    width:100%;
    height:350px;
    object-fit:cover;
    border-radius:15px;
    margin-top:20px;
}

.event-info{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-top:20px;
}

.event-title{
    font-size:30px;
    margin-bottom:10px;
}

.event-meta{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:20px;
    color:#555;
}

.description{
    line-height:1.7;
    margin-bottom:25px;
}

.ticket-options{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.ticket-card{
    border:2px solid #ddd;
    border-radius:12px;
    padding:20px;
    text-align:center;
    cursor:pointer;
}

.ticket-card.active,
.ticket-card:hover{
    border-color:#00b14f;
    background:#eefaf2;
}

.ticket-card h4{
    margin-bottom:10px;
}

.ticket-card p{
    color:#00b14f;
    font-weight:bold;
}

.continue-btn{
    width:100%;
    padding:16px;
    margin-top:25px;
    border:none;
    background:#00b14f;
    color:white;
    font-size:18px;
    border-radius:12px;
    cursor:pointer;
}

.continue-btn:hover{
    background:#009940;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f4f6f9;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 15px 25px;
    border-bottom: 1px solid #ddd;
}

/* LEFT SIDE */
.header-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* LOGO */
.logo {
    width: 50px;
    height: 50px;
    background: #2f80ed;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
}

/* TITLE */
.title h1 {
    font-size: 18px;
    font-weight: 600;
    color: #222;
}

.title p {
    font-size: 12px;
    color: #777;
}

/* RIGHT SIDE */
.header-right {
    display: flex;
    align-items: center;
}

/* USER */
.user-icon {
    text-align: center;
    font-size: 12px;
    color: #444;
}

.user-icon span {
    display: block;
    font-size: 20px;
    margin-bottom: 3px;
}
</style>
</head>

<body>
<header class="header">
    <div class="header-left">
        <div class="logo">ST</div>
        <div class="title">
            <h1>Smart Ticket</h1>
            <p>Online booking system</p>
        </div>
    </div>

    <div class="header-right">
        <div class="user-icon">
            <span>👤</span>
            <p>USER</p>
        </div>
    </div>
</header>
<div class="container">

<a href="event.html" class="back-link">← Back to Events</a>

<img id="eventImage" class="event-banner" alt="image">

<div class="event-info">

<h1 id="eventTitle" class="event-title"></h1>

<div class="event-meta">
<span id="eventLocation"></span>
<span id="eventDate"></span>
<span id="eventTime"></span>
</div>

<p id="eventDescription" class="description"></p>

<h3>Choose Ticket</h3>

<div class="ticket-options">

<div class="ticket-card active" data-type="VVIP" data-price="50000">
<h4>VVIP</h4>
<p>50,000 RWF</p>
</div>

<div class="ticket-card" data-type="VIP" data-price="30000">
<h4>VIP</h4>
<p>30,000 RWF</p>
</div>

<div class="ticket-card" data-type="Regular" data-price="15000">
<h4>Regular</h4>
<p>15,000 RWF</p>
</div>

</div>

<button class="continue-btn" onclick="goToPayment()">
Continue to Payment
</button>

</div>
</div>

<script>

// 🔥 LOAD EVENT
const eventData = JSON.parse(localStorage.getItem("selectedEvent"));

if(!eventData){
    window.location.href = "events.html";
}

// DISPLAY EVENT
document.getElementById("eventImage").src = eventData.image;
document.getElementById("eventTitle").innerText = eventData.title;
document.getElementById("eventLocation").innerText = "📍 " + eventData.location;
document.getElementById("eventDate").innerText = "📅 " + eventData.date;
document.getElementById("eventTime").innerText = "⏰ " + eventData.time;
document.getElementById("eventDescription").innerText = eventData.description;

// DEFAULT TICKET
let selectedTicket = {
    type: "VVIP",
    price: "50000"
};

// SELECT TICKET
document.querySelectorAll(".ticket-card").forEach(card => {
    card.addEventListener("click", function () {
        document.querySelectorAll(".ticket-card").forEach(c => c.classList.remove("active"));
        this.classList.add("active");

        selectedTicket.type = this.dataset.type;
        selectedTicket.price = this.dataset.price;
    });
});

// 🚀 GO TO PAYMENT (UNIFIED BOOKING OBJECT)
function goToPayment(){
    const paymentData = {
        type: "event",
        event: eventData,
        ticket: selectedTicket,
        user: {
            name: "",   // filled later in payment
            phone: ""
        }
    };

    localStorage.setItem("booking", JSON.stringify(paymentData));
    window.location.href = "payment.html";
}

</script>

</body>
</html>
