<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
}

/* Header */
.header{
    display:flex;
    align-items:center;
    padding:20px 30px;
}

.logo{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#2563eb;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    font-weight:bold;
    margin-right:12px;
}

.brand h2{
    font-size:24px;
}

.brand p{
    font-size:13px;
    color:#555;
}

/* Main */
.container{
    display:flex;
    justify-content:center;
    margin-top:40px;
}

.content{
    text-align:center;
}

.content h1{
    font-size:52px;
    margin-bottom:30px;
    font-family:Georgia, serif;
}

.login-box{
    width:600px;
    background:#ddd;
    padding:60px;
    border-radius:22px;
}

.form-group{
    text-align:left;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:10px;
    font-size:22px;
}

input{
    width:100%;
    padding:16px 20px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

button{
    width:75%;
    padding:16px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">ST</div>

    <div class="brand">
        <h2>Smart Ticket</h2>
        <p>Online booking system</p>
    </div>
</div>

<div class="container">
    <div class="content">

        <h1>ADMIN LOGIN PAGE</h1>

        <div class="login-box">

         <form id="adminLoginForm">
    <div class="form-group">
        <label>EMAIL</label>
        <input type="email" id="adminEmail" placeholder="Enter Admin Email" required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="adminPassword" placeholder="Enter Admin password" required>
    </div>

    <button type="submit">Login as Admin</button>
</form>

<script>
    const adminForm = document.getElementById('adminLoginForm');

    adminForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Stop the page from reloading

        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value.trim();

        // Check credentials
        if (email === "ishjado@gmail.com" && password === "grp1") {
            // 1. Create the security token
            localStorage.setItem('isAdmin', 'true');
            
            alert("Welcome back, Admin!");
            
            // 2. Redirect to the admin users list page
            
            window.location.href = 'admin.html'; 
        } else {
            alert("Access Denied: Incorrect Admin Credentials");
        }
    });
</script>

        </div>

    </div>
</div>

</body>
</html>
